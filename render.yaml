services:
  - type: worker
    name: ai-video-studio-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: VIDEO_API_URL
        sync: false
      - key: VIDEO_API_KEY
        sync: false
      - key: TTS_VOICE
        value: uz-UZ-MadinaNeural
